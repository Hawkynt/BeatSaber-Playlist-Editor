name: Refresh screenshots

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        shell: bash
        run: dotnet restore "BeatSaber Playlist Editor.sln"

      - name: Build screenshot target
        shell: bash
        run: dotnet build "src/BeatSaber Playlist Editor/BeatSaber Playlist Editor.csproj" --configuration Release --no-restore

      # The editor is a WinExe, so it is a GUI-subsystem process: PowerShell's call operator does
      # not wait for one, and $LASTEXITCODE stays whatever it was. The step used to finish before
      # the PNG existed and the commit below then reported the screenshot as current. Start-Process
      # -Wait is what actually blocks; the Test-Path is the proof the capture ran, because a
      # GUI process that dies on startup still leaves an exit code of 0 here.
      - name: Capture application screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs/screenshots | Out-Null
          $editor = Resolve-Path "src/BeatSaber Playlist Editor/bin/Release/net10.0-windows/BeatSaber Playlist Editor.exe"
          $shot = Join-Path (Get-Location) "docs/screenshots/main.png"
          $run = Start-Process -FilePath $editor -ArgumentList '--screenshot', $shot -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { exit $run.ExitCode }
          if (-not (Test-Path $shot)) {
            Write-Error "The editor exited 0 but wrote no screenshot to $shot."
            exit 1
          }

      # main takes changes through pull requests only, so the refreshed screenshot is proposed rather
      # than pushed. One long-lived branch is reused and force-updated: a screenshot is worth one open
      # pull request, never one per commit that lands on main. The commit is made through the
      # contents API, because a commit made by git on a runner is unsigned and its pull request would
      # then fail the signature rule forever.
      #
      # SCREENSHOT_PR_TOKEN is optional and only affects whether CI runs on the proposed change —
      # see the action's token input.
      - name: Propose the refreshed screenshot
        uses: Hawkynt/RepositoryTemplate/publish-generated-file@v1
        with:
          file: docs/screenshots/main.png
          branch: bot/screenshot
          message: '* refresh the application screenshot'
          title: '* refresh the application screenshot'
          body: >-
            The gallery moved. This is what `--screenshot` renders from the current build on `main`,
            which is the image the README shows.
          token: ${{ secrets.SCREENSHOT_PR_TOKEN || github.token }}
